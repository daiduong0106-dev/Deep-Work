name: WorkTimer
options:
  bundleIdPrefix: com.jun1stic
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    # Boss: điền Team ID của Apple ID vào đây, hoặc chọn trong Xcode > Signing
    DEVELOPMENT_TEAM: ""
targets:
  WorkTimer:
    type: application
    platform: iOS
    sources: [Shared, App]
    dependencies:
      - target: WorkWidget
    entitlements:
      path: App/WorkTimer.entitlements
      properties:
        com.apple.security.application-groups: [group.com.jun1stic.worktimer]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Work Timer
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jun1stic.worktimer
  WorkWidget:
    type: app-extension
    platform: iOS
    sources: [Shared, Widget]
    entitlements:
      path: Widget/WorkWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.jun1stic.worktimer]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Work Timer
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jun1stic.worktimer.widget
