<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Work Timer">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0f14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<title>Work Timer</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0b0f14;color:#e8edf2;font-family:-apple-system,system-ui,sans-serif;padding:max(env(safe-area-inset-top),16px) 16px 40px}
.wrap{max-width:480px;margin:0 auto}
h1{font-size:20px;margin:8px 0 16px;color:#9fb0c0;font-weight:600}
.clock{font-size:60px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums;margin:12px 0}
.btn{display:block;width:100%;border:0;border-radius:18px;padding:22px;font-size:24px;font-weight:700;color:#fff;background:#16a34a}
.btn.stop{background:#dc2626}
.card{background:#141a22;border-radius:16px;padding:16px;margin-top:16px}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0}
.bar{height:10px;background:#263140;border-radius:6px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:#16a34a;width:0}
.warn{color:#f59e0b}.ok{color:#22c55e}.mut{color:#7d8fa1;font-size:13px}
.step button{background:#263140;color:#fff;border:0;border-radius:8px;width:36px;height:36px;font-size:20px}
.add{background:#263140;color:#fff;border:0;border-radius:10px;padding:8px 12px;font-size:14px}
[data-id]{cursor:pointer}
dialog{background:#141a22;color:#e8edf2;border:0;border-radius:18px;padding:20px;width:min(92vw,420px)}
dialog::backdrop{background:#000a}
dialog label{display:block;margin:12px 0 4px;color:#9fb0c0;font-size:14px}
dialog input{width:100%;padding:12px;border-radius:10px;border:1px solid #263140;background:#0b0f14;color:#e8edf2;font-size:16px;color-scheme:dark}
.acts{display:flex;gap:8px;margin-top:18px}
.acts button{flex:1;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:600;color:#fff;background:#263140}
.acts .save{background:#16a34a}.acts .rm{background:#dc2626}
#dErr{color:#f59e0b;font-size:14px;min-height:18px;margin-top:8px}
</style></head><body><div class="wrap">
<h1>Work Timer</h1>
<div class="clock" id="clock">00:00:00</div>
<button class="btn" id="toggle">START</button>
<div class="card">
  <div class="row"><b>This week (Mon → Sun)</b><b id="week">0h 00m</b></div>
  <div class="bar"><i id="fill"></i></div>
  <div id="need"></div>
  <div class="row step"><span>Weekly minimum</span>
    <span><button id="m">−</button> <b id="tgt">20</b>h <button id="p">+</button></span></div>
</div>
<div class="card"><div class="row" style="padding-top:0"><b>Sessions this week</b><button class="add" id="add">+ Add</button></div>
<div class="mut">Tap a session to edit — e.g. if you forgot to stop.</div><div id="list"></div></div>
<dialog id="dlg"><b id="dTitle">Edit session</b>
<label for="dStart">Start</label><input type="datetime-local" id="dStart">
<label for="dEnd">End (leave empty = still running)</label><input type="datetime-local" id="dEnd">
<div id="dErr"></div>
<div class="acts"><button id="dCancel">Cancel</button><button class="rm" id="dDel">Delete</button><button class="save" id="dSave">Save</button></div></dialog>
</div>
<script>
const K='gioLam.sessions',T='gioLam.target';
const load=()=>{try{return JSON.parse(localStorage.getItem(K))||[]}catch(e){return[]}};
const save=s=>localStorage.setItem(K,JSON.stringify(s));
let target=+localStorage.getItem(T)||20;
const running=()=>load().find(s=>!s.end);
function start(){if(running())return;const s=load();s.push({id:Date.now(),start:Date.now()});save(s)}
function stop(){const s=load(),r=s.find(x=>!x.end);if(r){r.end=Date.now();save(s)}}
function weekRange(d=new Date()){const x=new Date(d);x.setHours(0,0,0,0);const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);return[x.getTime(),x.getTime()+7*864e5]}
const hm=ms=>{const m=Math.floor(ms/6e4);return Math.floor(m/60)+'h '+String(m%60).padStart(2,'0')+'m'};
const clk=ms=>{const s=Math.max(0,Math.floor(ms/1e3));return[Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(n=>String(n).padStart(2,'0')).join(':')};
const $=id=>document.getElementById(id);
function render(){
  const now=Date.now(),[a,b]=weekRange(),all=load(),r=all.find(s=>!s.end);
  const inWeek=all.filter(s=>(s.end||now)>a&&s.start<b).sort((x,y)=>y.start-x.start);
  const week=inWeek.reduce((t,s)=>t+Math.max(0,Math.min(s.end||now,b)-Math.max(s.start,a)),0);
  const goal=target*36e5,miss=Math.max(0,goal-week);
  $('clock').textContent=clk(r?now-r.start:0);
  $('toggle').textContent=r?'STOP':'START';$('toggle').className='btn'+(r?' stop':'');
  $('week').textContent=hm(week);$('fill').style.width=Math.min(100,week/goal*100)+'%';
  $('need').innerHTML=miss>0?'<span class="warn">'+hm(miss)+' left to reach '+target+'h</span>':'<span class="ok">Reached '+target+'h ✅</span>';
  $('tgt').textContent=target;
  const f=t=>new Date(t).toLocaleString('en-US',{weekday:'short',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
  $('list').innerHTML=inWeek.length?inWeek.map(s=>'<div class="row" data-id="'+s.id+'"><div>'+f(s.start)+'<div class="mut">'+(s.end?'→ '+new Date(s.end).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'}):'running')+'</div></div><div>'+hm((s.end||now)-s.start)+' ›</div></div>').join(''):'<div class="mut" style="padding-top:8px">No sessions yet</div>';
}
$('toggle').onclick=()=>{running()?stop():start();render()};
$('m').onclick=()=>{target=Math.max(1,target-1);localStorage.setItem(T,target);render()};
$('p').onclick=()=>{target=Math.min(80,target+1);localStorage.setItem(T,target);render()};
const dlg=$('dlg');let editId=null;
const loc=t=>new Date(t-new Date(t).getTimezoneOffset()*6e4).toISOString().slice(0,16);
const err=m=>{$('dErr').textContent=m};
function openEdit(id){
  editId=id;const s=id?load().find(x=>String(x.id)===String(id)):null;
  $('dTitle').textContent=s?'Edit session':'Add session';
  $('dStart').value=loc(s?s.start:Date.now()-36e5);
  $('dEnd').value=s?(s.end?loc(s.end):''):loc(Date.now());
  $('dDel').style.display=s?'':'none';err('');dlg.showModal();
}
$('list').onclick=e=>{const r=e.target.closest('[data-id]');if(r)openEdit(r.dataset.id)};
$('add').onclick=()=>openEdit(null);
$('dCancel').onclick=e=>{e.preventDefault();dlg.close()};
$('dDel').onclick=e=>{e.preventDefault();if(confirm('Delete this session?')){save(load().filter(x=>String(x.id)!==String(editId)));dlg.close();render()}};
$('dSave').onclick=e=>{
  e.preventDefault();
  const st=new Date($('dStart').value).getTime(),en=$('dEnd').value?new Date($('dEnd').value).getTime():null,now=Date.now();
  if(isNaN(st))return err('Enter a start time');
  if(st>now+6e4)return err("Start can't be in the future");
  if(en!==null&&(isNaN(en)||en<=st))return err('End must be after start');
  if(en!==null&&en>now+6e4)return err("End can't be in the future");
  const all=load();
  if(en===null&&all.some(x=>!x.end&&String(x.id)!==String(editId)))return err('Another session is already running');
  if(editId){const x=all.find(y=>String(y.id)===String(editId));x.start=st;if(en===null)delete x.end;else x.end=en}
  else all.push(en===null?{id:Date.now(),start:st}:{id:Date.now(),start:st,end:en});
  save(all);dlg.close();render();
};
function hash(){const h=location.hash;if(h==='#start')start();else if(h==='#stop')stop();else return;history.replaceState(null,'',location.pathname);render()}
addEventListener('hashchange',hash);hash();render();
setInterval(render,1000);
document.addEventListener('visibilitychange',render);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
